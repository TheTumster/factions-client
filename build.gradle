plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"factionsclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	exclusiveContent {
		forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

// -PdevPackMods (smoke test only): run the dev game with the same Litematica / Printer / Xaero builds the pack ships,
// so the in-menu settings pages for those mods get tested too.
if (project.hasProperty("devPackMods")) {
	def manifest = new groovy.json.JsonSlurper().parse(new URL("https://github.com/TheTumster/factions-client/releases/latest/download/manifest.json"))
	manifest.mods.each { m ->
		if (m.filename ==~ /^(litematica|malilib|xaerominimap).*/) {
			def id = (m.url =~ /data\/([^\/]+)\/versions\/([^\/]+)\//)
			if (id.find()) {
				dependencies.add("modLocalRuntime", "maven.modrinth:${id.group(1)}:${id.group(2)}")
				logger.lifecycle("dev pack mod: ${m.filename}")
			}
			// Mods ship libraries inside their jars (xaerolib, conditional-mixin...); the dev game needs them as mods.
			def dir = layout.buildDirectory.dir("dev-pack-mods").get().asFile
			dir.mkdirs()
			def jar = new File(dir, m.filename)
			if (!jar.exists()) new URL(m.url).withInputStream { i -> jar.withOutputStream { it << i } }
			def zip = new java.util.zip.ZipFile(jar)
			zip.entries().findAll { it.name ==~ /META-INF\/jars\/[^\/]+\.jar/ }.each { e ->
				def lib = new File(dir, e.name.substring(e.name.lastIndexOf('/') + 1))
				if (!lib.exists()) lib.withOutputStream { it << zip.getInputStream(e) }
				dependencies.add("modLocalRuntime", files(lib))
				logger.lifecycle("dev pack mod: ${lib.name} (inside ${m.filename})")
			}
			zip.close()
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// The RelapsedMC server pack (logo, icons, menu art: assets/relapsed/**) is baked into the client, so it's always
// there without the server prompting. Fetched fresh from the network's latest release on every build.
def relapsedPack = layout.buildDirectory.file("relapsed-pack/RelapsedMC-pack.zip")
def fetchRelapsedPack = tasks.register("fetchRelapsedPack") {
	outputs.file(relapsedPack)
	outputs.upToDateWhen { false }
	doLast {
		def f = relapsedPack.get().asFile
		f.parentFile.mkdirs()
		try {
			new URL("https://github.com/TheTumster/lag-network/releases/latest/download/RelapsedMC-pack.zip").withInputStream { i ->
				f.withOutputStream { it << i }
			}
			logger.lifecycle("RelapsedMC pack: ${f.length().intdiv(1024)} KB")
		} catch (Exception e) {
			f.delete()
			logger.warn("Couldn't fetch the RelapsedMC pack (${e.message}); building without it")
		}
	}
}
processClientResources {
	dependsOn fetchRelapsedPack
	from({ relapsedPack.get().asFile.exists() ? zipTree(relapsedPack) : [] }) {
		include "assets/relapsed/**"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
