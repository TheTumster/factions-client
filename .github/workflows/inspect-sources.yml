name: inspect-sources
on:
  push:
    branches: [inspect-sources]
jobs:
  sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew && ./gradlew genSources -q || true
      - name: collect
        run: |
          mkdir -p out
          for j in $(find ~/.gradle .gradle -name "*minecraft-*sources.jar" 2>/dev/null); do cp "$j" out/; done
          for j in $(find ~/.gradle -path "*net.fabricmc.fabric-api*" -name "fabric-networking-api*sources*.jar" -o -path "*fabric*" -name "fabric-screen-api*sources*.jar" 2>/dev/null | head -4); do cp "$j" out/; done
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: mc-sources, path: out }
