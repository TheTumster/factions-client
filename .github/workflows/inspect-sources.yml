name: inspect-sources
on:
  push:
    branches: [inspect-sources]
permissions:
  contents: write
jobs:
  sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew && ./gradlew genSources -q || true
      - name: commit sources to inspect-sources-out
        run: |
          mkdir -p /tmp/src && cd /tmp/src
          for j in $(find ~/.gradle $GITHUB_WORKSPACE/.gradle -name "*minecraft-*sources.jar" 2>/dev/null); do unzip -oq "$j" 'net/minecraft/client/*' 'net/minecraft/network/*' 'net/minecraft/resources/*' 'com/mojang/realmsclient/*' || true; done
          du -sh /tmp/src
          git init -q -b inspect-sources-out && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm sources
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" inspect-sources-out
