name: smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display + software OpenGL
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb mesa-utils libgl1-mesa-dri x11-apps imagemagick >/dev/null
      - name: Launch the game for 150s
        env:
          LAGCLIENT_SMOKE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.5"
        run: |
          chmod +x ./gradlew
          mkdir -p run
          echo "eula=true" > run/eula.txt
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2
          (timeout 230 ./gradlew runClient --no-daemon > game.log 2>&1 || true) &
          mkdir -p shots
          for i in $(seq 1 45); do
            sleep 5
            stage=$(grep -o "SMOKE stage [a-z-]*" game.log | tail -1 | awk '{print $3}')
            if [ -n "$stage" ] && [ ! -f "shots/$stage.done" ]; then
              sleep 4
              import -window root -resize 960x540 -quality 70 "shots/$stage.jpg" && touch "shots/$stage.done"
            fi
          done
          wait || true
          for f in shots/*.jpg; do echo "=====SHOT $f"; base64 -w0 "$f"; echo; done
      - name: Report
        if: always()
        run: |
          echo "===== KEY LINES"
          grep -nE "laG Client loaded|Mixin|mixin|ERROR|Exception|Caused by|crash|OpenGL|Backend library|Sound engine started|Created: " game.log | head -80
          echo "===== TAIL"
          tail -60 game.log
          ls run/crash-reports 2>/dev/null && cat run/crash-reports/* | head -80
