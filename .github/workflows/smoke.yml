name: smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display + software OpenGL
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb mesa-utils libgl1-mesa-dri x11-apps imagemagick xdotool >/dev/null
      - name: Launch the game for 150s
        env:
          LAGCLIENT_SMOKE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.5"
        run: |
          chmod +x ./gradlew
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "onboardAccessibility:false\nskipMultiplayerWarning:true\njoinedFirstServer:true\ntutorialStep:none\n" > run/options.txt
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2
          (timeout 230 ./gradlew runClient --no-daemon > game.log 2>&1 || true) &
          GAME=$!
          mkdir -p shots
          wait $GAME || true
          pkill Xvfb || true
          i=0; for f in $(ls -tr run/screenshots/*.png 2>/dev/null); do i=$((i+1)); convert "$f" -resize 960x540 -quality 72 "shots/s$i.jpg"; done
          for f in $(ls shots/*.jpg 2>/dev/null); do echo "=====SHOT $f"; base64 -w0 "$f"; echo; done
      - name: Report
        if: always()
        run: |
          echo "===== KEY LINES"
          grep -nE "laG Client loaded|Mixin|mixin|ERROR|Exception|Caused by|crash|OpenGL|Backend library|Sound engine started|Created: " game.log | head -80
          echo "===== TAIL"
          tail -60 game.log
          ls run/crash-reports 2>/dev/null && cat run/crash-reports/* | head -80
