name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: chmod +x ./gradlew && ./gradlew build -Pversion=1.0.${{ github.run_number }} --stacktrace
      - name: Build packs + update manifest
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          FC_SUPABASE_URL: ${{ secrets.FC_SUPABASE_URL }}
          FC_SUPABASE_ANON_KEY: ${{ secrets.FC_SUPABASE_ANON_KEY }}
          FC_TEAM_KEY: ${{ secrets.FC_TEAM_KEY }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          python3 tools/build_mrpack.py "$JAR" "Factions Client.mrpack" manifest.json "Factions Client (team).mrpack"
      # Private copy with the group password baked in: only downloadable by you from the Actions tab.
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            Factions Client.mrpack
            manifest.json
            build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Factions-Client-PRIVATE
          path: |
            Factions Client (team).mrpack
            Factions Client.mrpack
          if-no-files-found: ignore

  # Launch the real game headless and walk through the laG screens. If this fails, nothing gets released.
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display + software OpenGL
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb mesa-utils libgl1-mesa-dri x11-apps imagemagick xdotool >/dev/null
      - name: Launch the game for 150s
        env:
          LAGCLIENT_SMOKE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.5"
        run: |
          chmod +x ./gradlew
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "onboardAccessibility:false\nskipMultiplayerWarning:true\njoinedFirstServer:true\ntutorialStep:none\n" > run/options.txt
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2
          (timeout 230 ./gradlew runClient --no-daemon > game.log 2>&1 || true) &
          GAME=$!
          mkdir -p shots
          wait $GAME || true
          pkill Xvfb || true
          i=0; for f in $(ls -tr run/screenshots/*.png 2>/dev/null); do i=$((i+1)); convert "$f" -resize 960x540 -quality 72 "shots/s$i.jpg"; done
          for f in $(ls shots/*.jpg 2>/dev/null); do echo "=====SHOT $f"; base64 -w0 "$f"; echo; done
      - name: Report
        if: always()
        run: |
          echo "===== KEY LINES"
          grep -nE "laG Client loaded|Mixin|mixin|ERROR|Exception|Caused by|crash|OpenGL|Backend library|Sound engine started|Created: " game.log | head -80
          echo "===== TAIL"
          tail -60 game.log
          ls run/crash-reports 2>/dev/null && cat run/crash-reports/* | head -80 || true
      - name: Verify the game reached every laG screen without crashing
        run: |
          if ls run/crash-reports/*.txt >/dev/null 2>&1; then echo "Game crashed"; exit 1; fi
          for st in title menu menu-hud options; do
            grep -q "SMOKE stage $st" game.log || { echo "Never reached: $st"; exit 1; }
          done
          echo "All screens OK"

  publish:
    needs: smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
      - name: Publish as latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "Factions Client.mrpack" manifest.json "$JAR" \
            --title "laG Client (build ${{ github.run_number }})" \
            --notes "First time: drag the .mrpack into the Modrinth App. After that the game updates itself on launch." --latest
