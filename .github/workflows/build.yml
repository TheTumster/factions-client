name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: chmod +x ./gradlew && ./gradlew build --stacktrace
      - name: Build Modrinth pack
        env:
          FC_SUPABASE_URL: ${{ secrets.FC_SUPABASE_URL }}
          FC_SUPABASE_ANON_KEY: ${{ secrets.FC_SUPABASE_ANON_KEY }}
          FC_TEAM_KEY: ${{ secrets.FC_TEAM_KEY }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          python3 tools/build_mrpack.py "$JAR" "Factions Client.mrpack"
      - uses: actions/upload-artifact@v4
        with:
          name: Factions-Client
          path: |
            Factions Client.mrpack
            build/libs/*.jar
