name: inspect
on:
  push:
    branches: [inspect]
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew && ./gradlew genSources -q || true
      - name: dump
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/mc && cd /tmp/mc
          for j in $(find ~/.gradle $GITHUB_WORKSPACE/.gradle -name "*minecraft-*sources.jar" 2>/dev/null); do echo "JAR $j"; unzip -oq "$j" 'net/minecraft/client/*'; done
          cd /tmp/mc/net/minecraft/client && pwd && ls | head
          sig() { echo "=====SIG $1"; grep -nP '^\t(public |protected |default |static |boolean |void |int |float |double |@Nullable )[^;=]*\(' "$1"; }
          for f in gui/components/AbstractButton.java gui/components/Button.java gui/components/AbstractWidget.java gui/screens/PauseScreen.java; do echo "=====FILE $f"; cat $f; done
          echo "=====FILE setScreen"; grep -n "public void setScreen\|public void disconnect\|disconnectFromWorld\|public void stop()" Minecraft.java
          exit 0
