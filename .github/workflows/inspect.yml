name: inspect
on:
  push:
    branches: [inspect]
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew && ./gradlew genSources -q || ./gradlew genClientOnlySources -q || true
      - name: dump
        run: |
          SRC=$(find ~/.gradle $PWD/.gradle -name "*minecraft*sources.jar" 2>/dev/null | head -5)
          echo "$SRC"
          mkdir src_mc && cd src_mc
          for j in $SRC; do unzip -oq "$j" 'net/minecraft/client/*' 'net/minecraft/world/entity/item/*' || true; done
          full() { echo "=====FILE $1"; cat "$1"; }
          sig() { echo "=====SIG $1"; grep -nE '^\s*(public|protected)[^=]*\(' "$1" | grep -v '^\s*//' ; }
          cd net/minecraft/client
          set +e
          sig() { echo "=====SIG $1"; grep -nE '^\s*(public|protected|default|static)?\s*[A-Za-z<>\[\], .?@]+\s+[a-zA-Z]+\(' "$1" | grep -vE '^\s*[0-9]+:\s*(//|return|if|else|this\.|super)' ; }
          sig gui/components/events/GuiEventListener.java
          sig gui/GuiGraphics.java
          sig MouseHandler.java
          sig KeyMapping.java
          sig gui/screens/worldselection/SelectWorldScreen.java
          sig gui/screens/multiplayer/JoinMultiplayerScreen.java
          sig gui/screens/options/OptionsScreen.java
          sig renderer/PanoramaRenderer.java
          sig gui/Font.java
          sig gui/screens/Overlay.java
          sig renderer/RenderPipelines.java | head -60
          grep -n "GUI_TEXTURED\b\|GUI\b =" renderer/RenderPipelines.java
          sed -n 740,800p gui/screens/TitleScreen.java
          exit 0
