name: inspect
on:
  push:
    branches: [inspect]
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew && ./gradlew genSources -q || true
      - name: dump
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/mc && cd /tmp/mc
          for j in $(find ~/.gradle $GITHUB_WORKSPACE/.gradle -name "*minecraft-*sources.jar" 2>/dev/null); do echo "JAR $j"; unzip -oq "$j" 'net/minecraft/client/*'; done
          cd /tmp/mc/net/minecraft/client && pwd && ls | head
          sig() { echo "=====SIG $1"; grep -nP '^\t(public |protected |default |static |boolean |void |int |float |double |@Nullable )[^;=]*\(' "$1"; }
          f=multiplayer/ClientHandshakePacketListenerImpl.java; echo "=====FILE $f"; sed -n 1,400p $f | grep -n "authenticateServer\|shouldAuthenticate\|handleHello\|private Component\|joinServer\|INVALID\|getSessionService\|disconnect" 
          echo "=====BODY"; awk '/void handleHello/,/^\t}/' multiplayer/ClientHandshakePacketListenerImpl.java; awk '/Component authenticateServer/,/^\t}/' multiplayer/ClientHandshakePacketListenerImpl.java
          exit 0
