name: inspect
on:
  push:
    branches: [inspect]
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew && ./gradlew genSources -q || true
      - name: dump
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/mc && cd /tmp/mc
          for j in $(find ~/.gradle $GITHUB_WORKSPACE/.gradle -name "*minecraft-*sources.jar" 2>/dev/null); do echo "JAR $j"; unzip -oq "$j" 'net/minecraft/client/*'; done
          cd /tmp/mc/net/minecraft/client && pwd && ls | head
          sig() { echo "=====SIG $1"; grep -nP '^\t(public |protected |default |static |boolean |void |int |float |double |@Nullable )[^;=]*\(' "$1"; }
          unzip -oq $(find ~/.gradle $GITHUB_WORKSPACE/.gradle -name "*minecraft-*sources.jar" 2>/dev/null | head -1) 'net/minecraft/world/entity/item/*' -d /tmp/mc || true
          echo "=====LS fog"; ls -R renderer/fog
          for f in $(find renderer/fog -name "*.java"); do echo "=====FILE $f"; cat $f; done
          echo "=====FIRE"; awk '/renderFire/,/^\t}/' renderer/ScreenEffectRenderer.java | head -80
          echo "=====PE"; grep -n "public .*(" particle/ParticleEngine.java | head -40
          echo "=====PE-create"; awk '/Particle createParticle/,/^\t}/' particle/ParticleEngine.java | head -40
          echo "=====CL"; grep -n "addParticle\|addAlwaysVisibleParticle" multiplayer/ClientLevel.java | head
          echo "=====LR"; grep -n "addParticle\|private .*Particle" renderer/LevelRenderer.java | head -20
          echo "=====EXPL"; awk '/void handleExplosion/,/^\t}/' multiplayer/ClientPacketListener.java
          echo "=====TNT"; grep -n "Particle\|isClientSide" /tmp/mc/net/minecraft/world/entity/item/PrimedTnt.java
          echo "=====LIQUID"; grep -rn "getAverageWaterColor\|WATER_FOG\|waterFog" --include=*.java . | head -20
          exit 0
