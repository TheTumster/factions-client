name: inspect
on:
  push:
    branches: [inspect]
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew && ./gradlew genSources -q || true
      - name: dump
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/mc && cd /tmp/mc
          for j in $(find ~/.gradle $GITHUB_WORKSPACE/.gradle -name "*minecraft-*sources.jar" 2>/dev/null); do echo "JAR $j"; unzip -oq "$j" 'net/minecraft/client/*'; done
          cd /tmp/mc/net/minecraft/client && pwd && ls | head
          sig() { echo "=====SIG $1"; grep -nP '^\t(public |protected |default |static |boolean |void |int |float |double |@Nullable )[^;=]*\(' "$1"; }
          sig gui/components/events/GuiEventListener.java
          sig gui/GuiGraphics.java
          sig MouseHandler.java
          sig KeyMapping.java
          sig gui/screens/worldselection/SelectWorldScreen.java
          sig gui/screens/multiplayer/JoinMultiplayerScreen.java
          sig gui/screens/options/OptionsScreen.java
          sig renderer/PanoramaRenderer.java
          sig gui/Font.java
          sig gui/screens/Overlay.java
          grep -n "public static final RenderPipeline GUI" renderer/RenderPipelines.java
          echo "=====TITLE RENDER"; sed -n 300,360p gui/screens/TitleScreen.java
          exit 0
