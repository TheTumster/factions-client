name: inspect
on:
  push:
    branches: [inspect]
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew && ./gradlew genSources -q || true
      - name: dump
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/mc && cd /tmp/mc
          for j in $(find ~/.gradle $GITHUB_WORKSPACE/.gradle -name "*minecraft-*sources.jar" 2>/dev/null); do echo "JAR $j"; unzip -oq "$j" 'net/minecraft/client/*'; done
          cd /tmp/mc/net/minecraft/client && pwd && ls | head
          sig() { echo "=====SIG $1"; grep -nP '^\t(public |protected |default |static |boolean |void |int |float |double |@Nullable )[^;=]*\(' "$1"; }
          for f in renderer/PostChainConfig.java renderer/PostChain.java; do echo "=====FILE $f"; cat $f; done
          echo "=====GR"; grep -n "PostEffect\|postEffect\|PostChain\|processBlurEffect\|BLUR_POST\|getMainRenderTarget" renderer/GameRenderer.java
          echo "=====LR"; grep -n "PostEffect\|postEffect\|PostChain\|TRANSPARENCY_POST\|ENTITY_OUTLINE" renderer/LevelRenderer.java | head -40
          mkdir -p /tmp/assets && cd /tmp/assets
          for j in $(find ~/.gradle $GITHUB_WORKSPACE/.gradle -name "minecraft-*.jar" ! -name "*sources*" 2>/dev/null); do unzip -oq "$j" 'assets/minecraft/post_effect/*' 'assets/minecraft/shaders/post/*' 'assets/minecraft/shaders/include/*' 2>/dev/null; done
          ls assets/minecraft/post_effect assets/minecraft/shaders/post
          for f in assets/minecraft/post_effect/blur.json assets/minecraft/post_effect/invert.json assets/minecraft/post_effect/creeper.json assets/minecraft/shaders/post/blit.fsh assets/minecraft/shaders/post/invert.fsh assets/minecraft/shaders/post/sobel.vsh assets/minecraft/shaders/post/blur.fsh assets/minecraft/shaders/post/box_blur.fsh assets/minecraft/shaders/post/screenquad.vsh; do echo "=====FILE $f"; cat $f; done
          exit 0
